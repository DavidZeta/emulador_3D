<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111417" />
    <meta
      name="description"
      content="Emulador web mobile-first para un cartucho Game Boy impreso en 3D con NFC."
    />
    <title>Mini Cartucho NFC</title>
    <link rel="preconnect" href="https://cdn.emulatorjs.org" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell" aria-label="Emulador Game Boy">
      <header class="topbar">
        <div>
          <p class="eyebrow">NFC Cartridge</p>
          <h1 id="game-title">Mini Cartucho</h1>
        </div>
        <button class="audio-button" id="audio-toggle" type="button" aria-pressed="false">
          Activar sonido
        </button>
      </header>

      <section class="screen-frame" aria-label="Pantalla del juego">
        <div class="screen-glass">
          <div id="game" class="game-canvas" role="application" aria-label="Canvas del emulador"></div>
          <div class="loading-panel" id="loading-panel">
            <span class="status-light" aria-hidden="true"></span>
            <span id="loading-text">Preparando emulador</span>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Mandos tactiles">
        <div class="dpad" aria-label="Cruceta">
          <button class="control-button dpad-button up" data-key="ArrowUp" aria-label="Arriba"></button>
          <button class="control-button dpad-button right" data-key="ArrowRight" aria-label="Derecha"></button>
          <button class="control-button dpad-button down" data-key="ArrowDown" aria-label="Abajo"></button>
          <button class="control-button dpad-button left" data-key="ArrowLeft" aria-label="Izquierda"></button>
          <span class="dpad-center" aria-hidden="true"></span>
        </div>

        <div class="face-buttons" aria-label="Botones A y B">
          <button class="control-button action-button b-button" data-key="KeyZ" aria-label="Boton B">
            B
          </button>
          <button class="control-button action-button a-button" data-key="KeyX" aria-label="Boton A">
            A
          </button>
        </div>
      </section>

      <section class="system-controls" aria-label="Botones Select y Start">
        <button class="control-button pill-button" data-key="ShiftRight" aria-label="Select">
          Select
        </button>
        <button class="control-button pill-button" data-key="Enter" aria-label="Start">
          Start
        </button>
      </section>
    </main>

    <script>
      window.ROM_CONFIG = {
        catalogUrl: "games.json",
        defaultGame: "pokemon-amarillo",
        color: "#8fbf45",
      };
    </script>
    <script src="app.js" defer></script>
  </body>
</html>
